[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpronounce"
version = "0.2.1"
description = "Open-source, phoneme-level English pronunciation assessment (Wav2Vec2 + DTW). Score a recording, list mispronounced words, get prosody curves."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jean-François Lépine" }]
requires-python = ">=3.10"
keywords = [
    "pronunciation", "pronunciation-assessment", "speech", "phonemes", "wav2vec2",
    "CAPT", "language-learning", "asr", "prosody", "visemes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "fastdtw>=0.3",
    "phonemizer>=3.2",
    "Levenshtein>=0.20",
    "gTTS>=2.3",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "python-multipart>=0.0.6",
    "jinja2>=3.1",
    "streamlit>=1.30",
]
tts-piper = [
    "piper-tts>=1.3",
    "huggingface_hub>=0.20",
]
tts-kokoro = [
    "kokoro>=0.9",
]
tts = [
    "openpronounce[tts-piper,tts-kokoro]",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "httpx>=0.24",
]

[project.scripts]
openpronounce = "openpronounce.cli:main"

[project.urls]
Homepage = "https://github.com/Halleck45/OpenPronounce"
Repository = "https://github.com/Halleck45/OpenPronounce"
Issues = "https://github.com/Halleck45/OpenPronounce/issues"
"Blog post" = "https://blog.lepine.pro/en/ai-wav2vec-pronunciation-vectorization/"

[tool.setuptools]
packages = ["openpronounce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short --strict-markers --disable-warnings --durations=10"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
